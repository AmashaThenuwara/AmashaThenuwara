<svg xmlns="http://www.w3.org/2000/svg" width="420" height="130" viewBox="0 0 420 130">
  <defs>
    <style>
      .bg { fill: #14223d; stroke: #88ccff; stroke-width: 2; rx: 12; animation: pulse 3s infinite alternate; }
      @keyframes pulse {
        from { filter: drop-shadow(0 0 2px #88ccff); }
        to { filter: drop-shadow(0 0 8px #b4dcff); }
      }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #dddddd; }
      .btn { fill: #111111; stroke: #88ccff; stroke-width: 1; rx: 6; animation: btnGlow 2s infinite alternate; }
      @keyframes btnGlow {
        from { stroke: #88ccff; }
        to { stroke: #ffffff; }
      }
      .btn-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #88ccff; }
      .icon { fill: #88ccff; }
    </style>
  </defs>
  <rect x="10" y="10" width="400" height="110" class="bg" />
  
  <!-- Folder Icon -->
  <svg x="20" y="25" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d896ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
  </svg>

  <text x="55" y="43" class="title">Health Care System (DM2)</text>
  <text x="20" y="70" class="desc">Data Mining, Warehousing, and</text>
  <text x="20" y="92" class="desc">Business Intelligence healthcare system.</text>
  
  <rect x="280" y="80" width="115" height="28" class="btn" />
  <text x="337" y="99" class="btn-text" text-anchor="middle">View on GitHub</text>
</svg>